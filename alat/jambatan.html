<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Jambatan media</title></head><body style="font-family:sans-serif;padding:20px">Memindah fail media ke Threads&hellip;<script>
(async () => {
  const T = 'https://www.threads.com';
  const op = window.opener;
  if (!op) { document.body.textContent = 'Halaman ini hanya untuk kegunaan dalaman.'; return; }
  const nama = decodeURIComponent(location.hash.slice(1)).split(',').filter(n => /^[A-Za-z0-9._-]+\.(png|jpg|webp|mp4)$/.test(n));
  for (const n of nama) {
    try {
      const r = await fetch('/aset/threads/' + n, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const b = await r.arrayBuffer();
      op.postMessage({ sbj: 1, name: n, type: r.headers.get('content-type'), buf: b }, T, [b]);
    } catch (e) { op.postMessage({ sbj: 1, name: n, err: String(e) }, T); }
  }
  op.postMessage({ sbj: 1, done: true }, T);
  setTimeout(() => window.close(), 800);
})();
</script></body></html>
